<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef5"/>
      <stop offset="100%" stop-color="#dae2ec"/>
    </linearGradient>
    <pattern id="fine" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#2563eb" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <pattern id="coarse" width="110" height="110" patternUnits="userSpaceOnUse">
      <path d="M 110 0 L 0 0 0 110" fill="none" stroke="#1d4ed8" stroke-opacity="0.30" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#fine)"/>
  <rect width="1920" height="1080" fill="url(#coarse)"/>
</svg>
