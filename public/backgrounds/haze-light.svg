      <stop offset="55%" stop-color="#fb7185" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="84%" r="52%">
